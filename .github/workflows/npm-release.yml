name: npm release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      channel: ${{ steps.preflight.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - name: Validate tag, source and publication scope
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p = require('./package.json');
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(dev|exp|beta|rc|stable)(\.(0|[1-9]\d*))?)?$/;
          if (p.private === true) throw new Error('package.json is private; publication is disabled');
          if (!semver.test(p.version) || process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error('Release tag must equal v<package.json version> (stable or a supported prerelease channel)');
          if (p.repository?.url !== `https://github.com/${process.env.GITHUB_REPOSITORY}.git`) throw new Error('package.json repository.url must match this GitHub repository');
          NODE
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$main_sha" && test "$main_sha" = "$(git rev-parse HEAD)" || { echo 'Tag must point to the current public main commit' >&2; exit 1; }
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          encoded_name="$(node -p 'encodeURIComponent(require("./package.json").name)')"
          status="$(curl --retry 3 --max-time 20 --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${encoded_name}/${version}")"
          case "$status" in
            200) echo 'This npm version already exists; refusing to republish' >&2; exit 1 ;;
            404) ;;
            *) echo "Cannot verify npm version availability (HTTP $status)" >&2; exit 1 ;;
          esac
          case "$version" in
            *-dev|*-dev.*) channel=dev ;;
            *-exp|*-exp.*) channel=exp ;;
            *-beta|*-beta.*) channel=beta ;;
            *-rc|*-rc.*) channel=rc ;;
            *-stable|*-stable.*) channel=stable ;;
            *) channel=latest ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint-check
      - run: pnpm run typecheck
      - run: CI=true pnpm run test
      - run: pnpm run build
      - name: Publish to npm with OIDC
        run: npm publish --access public --tag "${{ steps.preflight.outputs.channel }}" --ignore-scripts
      - name: Verify npm version and dist-tag
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          channel="${{ steps.preflight.outputs.channel }}"
          # npm trusted publishing may keep a successfully accepted version in
          # automated validation for several minutes before it becomes public.
          for attempt in {1..120}; do
            published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
            tag_version="$(npm view "${name}" "dist-tags.${channel}" 2>/dev/null || true)"
            if test "$published" = "$version" && test "$tag_version" = "$version"; then exit 0; fi
            sleep 5
          done
          echo 'npm registry verification failed' >&2
          exit 1

  github_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for verified npm version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ needs.publish.outputs.channel }}" = latest; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease --latest=false
          fi
